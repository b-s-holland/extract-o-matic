<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Extract-O-Matic lever favicon">
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ecd1"/>
      <stop offset="1" stop-color="#d9c89d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c4a49"/>
      <stop offset="1" stop-color="#2a292a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7176"/>
      <stop offset="0.28" stop-color="#d7d9dc"/>
      <stop offset="0.55" stop-color="#f4f4f4"/>
      <stop offset="0.78" stop-color="#b4b7bb"/>
      <stop offset="1" stop-color="#5f6266"/>
    </linearGradient>
    <radialGradient id="red" cx="35%" cy="28%" r="70%">
      <stop offset="0" stop-color="#ef5547"/>
      <stop offset="0.45" stop-color="#c52219"/>
      <stop offset="1" stop-color="#7b0d0a"/>
    </radialGradient>
    <radialGradient id="brass" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffe7a4"/>
      <stop offset="0.5" stop-color="#d7aa53"/>
      <stop offset="1" stop-color="#8b6428"/>
    </radialGradient>
  </defs>

  <!-- outer machine housing -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="url(#cream)" stroke="#2d261d" stroke-width="2.4"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="8.5" fill="none" stroke="#fff7df" stroke-width="1.4" opacity=".9"/>

  <!-- dark control plate -->
  <rect x="11" y="11" width="42" height="42" rx="7" fill="url(#panel)" stroke="#171515" stroke-width="2"/>
  <rect x="13.2" y="13.2" width="37.6" height="37.6" rx="5.2" fill="none" stroke="#6d6c6b" stroke-width="1" opacity=".45"/>

  <!-- rivets -->
  <g stroke="#2a2116" stroke-width="1">
    <circle cx="17" cy="17" r="2.6" fill="url(#brass)"/>
    <circle cx="47" cy="17" r="2.6" fill="url(#brass)"/>
    <circle cx="17" cy="47" r="2.6" fill="url(#brass)"/>
    <circle cx="47" cy="47" r="2.6" fill="url(#brass)"/>
  </g>

  <!-- lever slot -->
  <rect x="27" y="25.5" width="10" height="22.5" rx="5" fill="#151414" stroke="#1c1814" stroke-width="1.5"/>
  <rect x="28.3" y="26.8" width="7.4" height="19.9" rx="3.7" fill="none" stroke="#ead8ad" stroke-width="1.5"/>

  <!-- lever shaft -->
  <rect x="30.1" y="24.3" width="3.8" height="20" rx="1.9" fill="url(#metal)" stroke="#4a4c4f" stroke-width=".7"/>

  <!-- knob -->
  <circle cx="32" cy="23.3" r="7.4" fill="#52100d" stroke="#15100f" stroke-width="1.5"/>
  <circle cx="32" cy="23.3" r="6.1" fill="url(#red)"/>
  <ellipse cx="29.7" cy="20.8" rx="2.0" ry="1.2" fill="#ffd2c8" opacity=".85"/>

  <!-- tiny green ready lamp -->
  <circle cx="20" cy="31.5" r="1.4" fill="#7cf2a0" stroke="#183b25" stroke-width=".7"/>
</svg>
